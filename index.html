<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desafio Quântico: Fuga da Álgebra Linear</title>
  <style>
    body {
      background-color: #090a10;
      color: #00f3ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #121526;
      border: 2px solid #00f3ff;
      padding: 30px;
      border-radius: 10px;
      width: 450px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }
    input {
      background: #05060a;
      border: 1px solid #00f3ff;
      color: white;
      padding: 10px;
      font-size: 1.2rem;
      width: 80%;
      margin: 15px 0;
      text-align: center;
      border-radius: 5px;
    }
    button {
      background: #00f3ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      font-size: 1rem;
    }
    button:hover {
      background: #fff;
    }
    .msg { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚡ DESAFIO QUÂNTICO ⚡</h2>
    <p id="fase-titulo" style="color: #ff007f; margin: 10px 0;">Fase 1 / 6</p>
    <div id="enunciado" style="margin: 20px 0; line-height: 1.5;">Carregando...</div>
    
    <input type="number" id="resposta" placeholder="Sua resposta...">
    <br>
    <button onclick="verificar()">RESPONDER</button>
    <div class="msg" id="mensagem"></div>
  </div>

  <script>
    let fase = 1;
    let respostaCorreta = 0;

    function carregarFase() {
      document.getElementById("resposta").value = "";
      document.getElementById("mensagem").innerText = "";
      
      // FÁCIL (1 e 2)
      if (fase === 1) {
        document.getElementById("fase-titulo").innerText = "FASE 1 / 6 [FÁCIL]: Multiplicação por Escalar";
        document.getElementById("enunciado").innerHTML = "Multiplique o vetor <b>v = (4)</b> pelo escalar <b>k = 3</b>.<br><small>Dica: 3 × 4</small>";
        respostaCorreta = 12;
      } else if (fase === 2) {
        document.getElementById("fase-titulo").innerText = "FASE 2 / 6 [FÁCIL]: Soma de Vetores";
        document.getElementById("enunciado").innerHTML = "Some os vetores 1D:<br><b>A = [7]</b> e <b>B = [8]</b><br><small>Dica: 7 + 8</small>";
        respostaCorreta = 15;
      
      // MÉDIO (3 e 4)
      } else if (fase === 3) {
        document.getElementById("fase-titulo").innerText = "FASE 3 / 6 [MÉDIO]: Determinante 2x2";
        document.getElementById("enunciado").innerHTML = "Calcule o determinante da matriz:<br>| 2 &nbsp; 1 |<br>| 2 &nbsp; 5 |<br><small>Dica: (2 × 5) - (1 × 2)</small>";
        respostaCorreta = 8;
      } else if (fase === 4) {
        document.getElementById("fase-titulo").innerText = "FASE 4 / 6 [MÉDIO]: Produto Escalar";
        document.getElementById("enunciado").innerHTML = "Calcule o produto escalar dos vetores:<br><b>u = (3, 2)</b> e <b>v = (4, 1)</b><br><small>Dica: (3 × 4) + (2 × 1)</small>";
        respostaCorreta = 14;
      
      // DIFÍCIL (5 e 6)
      } else if (fase === 5) {
        document.getElementById("fase-titulo").innerText = "FASE 5 / 6 [DIFÍCIL]: Matriz × Vetor";
        document.getElementById("enunciado").innerHTML = "Calcule a 1ª coordenada (linha 1 × coluna) da multiplicação:<br>| 2 &nbsp; 3 | &nbsp; × &nbsp; | 4 |<br>| 1 &nbsp; 5 | &nbsp; &nbsp; &nbsp; &nbsp; | 2 |<br><small>Dica: (2 × 4) + (3 × 2)</small>";
        respostaCorreta = 14;
      } else if (fase === 6) {
        document.getElementById("fase-titulo").innerText = "FASE 6 / 6 [DIFÍCIL]: Autovalores";
        document.getElementById("enunciado").innerHTML = "Qual é o <b>MAIOR autovalor (λ)</b> da matriz diagonal?<br>| 7 &nbsp; 0 |<br>| 0 &nbsp; 3 |<br><small>Dica: Em matrizes diagonais, os autovalores são a própria diagonal (7 e 3).</small>";
        respostaCorreta = 7;
      }
    }

    function verificar() {
      let val = parseInt(document.getElementById("resposta").value);
      let msg = document.getElementById("mensagem");

      if (val === respostaCorreta) {
        msg.style.color = "#00ff88";
        msg.innerText = "CORRETO! Avançando...";
        setTimeout(() => {
          fase++;
          if (fase > 6) {
            document.querySelector(".card").innerHTML = "<h1 style='color: #00ff88;'>🎉 VOCÊ ESCAPOU!</h1><p>Parabéns por dominar todos os níveis de Álgebra Linear!</p>";
          } else {
            carregarFase();
          }
        }, 1200);
      } else {
        msg.style.color = "#ff007f";
        msg.innerText = "ERRADO! Tente novamente.";
      }
    }

    // Suporte para tecla ENTER
    document.getElementById("resposta").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        verificar();
      }
    });

    carregarFase();
  </script>

</body>
</html>
