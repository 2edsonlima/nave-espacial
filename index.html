<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Quântico: Fuga da Álgebra Linear</title>
  <style>
    :root {
      --bg-color: #070913;
      --card-bg: #101426;
      --border-color: #00f3ff;
      --accent-pink: #ff007f;
      --accent-green: #00ff88;
      --text-main: #f8fafc;
      --text-rules: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #0f172a 0%, #070913 100%);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.35);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 243, 255, 0.15);
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .game-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #00f3ff, #ff007f);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 15px;
    }

    .title-area h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #00f3ff;
      text-transform: uppercase;
      font-family: 'Courier New', Courier, monospace;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge-fase {
      background: rgba(255, 0, 127, 0.2);
      color: #ff4da6;
      border: 1px solid rgba(255, 0, 127, 0.5);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .btn-ajuda {
      background: rgba(0, 243, 255, 0.15);
      color: #00f3ff;
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ajuda:hover {
      background: #00f3ff;
      color: #070913;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00f3ff, #00ff88);
      width: 16.66%;
      transition: width 0.4s ease;
    }

    .question-card {
      background: #0b0f1e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .question-statement {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #ffffff;
      font-weight: 600;
      font-family: 'Courier New', Courier, monospace;
      background: #05070f;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #00f3ff;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    .explanation-box {
      background: #131b31;
      border: 1px solid rgba(0, 243, 255, 0.45);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.95rem;
      color: var(--text-rules);
      line-height: 1.5;
    }

    .explanation-box strong {
      color: #00f3ff;
      font-weight: 700;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="number"] {
      flex: 1;
      background: #05070f;
      border: 2px solid rgba(0, 243, 255, 0.5);
      color: #ffffff;
      padding: 12px 16px;
      font-size: 1.2rem;
      border-radius: 8px;
      outline: none;
      transition: all 0.3s ease;
      font-family: 'Courier New', Courier, monospace;
    }

    input[type="number"]:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }

    button.btn-responder {
      background: #00f3ff;
      color: #070913;
      border: none;
      padding: 0 25px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button.btn-responder:hover {
      background: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 243, 255, 0.4);
    }

    .msg {
      font-weight: 700;
      font-size: 1rem;
      min-height: 24px;
      text-align: center;
      margin-top: 10px;
      transition: color 0.3s ease;
    }

    /* Modal de Ajuda & Calculadora */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.92);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.ativo {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #12182d;
      border: 1px solid #00f3ff;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 243, 255, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .modal-header h3 {
      color: #00f3ff;
      font-size: 1.1rem;
    }

    .btn-fechar {
      background: none;
      border: none;
      color: #ff4da6;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .calc-screen {
      width: 100%;
      background: #05070f;
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.3rem;
      padding: 12px;
      text-align: right;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .calc-btn {
      background: #1e2642;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .calc-btn:hover {
      background: #00f3ff;
      color: #070913;
    }

    .calc-btn.op {
      background: rgba(0, 243, 255, 0.2);
      color: #00f3ff;
    }

    .calc-btn.igual {
      background: var(--accent-green);
      color: #070913;
      grid-column: span 2;
    }

    .calc-btn.limpar {
      background: rgba(255, 0, 127, 0.2);
      color: #ff4da6;
    }

    .victory-screen {
      text-align: center;
      padding: 30px 10px;
    }

    .victory-screen h2 {
      color: var(--accent-green);
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .victory-screen p {
      color: var(--text-rules);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-restart {
      background: var(--accent-green);
      color: #070913;
      border: none;
      padding: 12px 30px;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-restart:hover {
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @media (max-width: 480px) {
      .game-container {
        padding: 20px;
      }
      .input-group {
        flex-direction: column;
      }
      button.btn-responder {
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="game-container" id="game-box">
    <div class="header">
      <div class="title-area">
        <h1>⚡ MATRIZES QUÂNTICAS</h1>
      </div>
      <div class="header-actions">
        <button class="btn-ajuda" onclick="alternarModal(true)">? Calculadora</button>
        <div class="badge-fase" id="fase-titulo">Fase 1 / 6</div>
      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="game-content">
      <div class="question-card">
        <div class="question-title" id="categoria-titulo">Multiplicação por Escalar</div>
        <div class="question-statement" id="enunciado">Carregando desafio...</div>
        <div class="explanation-box" id="explicacao">
          <strong>Como entender: </strong>Carregando explicação...
        </div>
      </div>

      <div class="input-group">
        <input type="number" id="resposta" placeholder="Digite sua resposta..." autocomplete="off">
        <button class="btn-responder" onclick="verificar()">Responder</button>
      </div>

      <div class="msg" id="mensagem"></div>
    </div>

    <!-- Modal de Ajuda & Calculadora -->
    <div class="modal-overlay" id="modal-ajuda">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🧮 Calculadora Quântica</h3>
          <button class="btn-fechar" onclick="alternarModal(false)">✕</button>
        </div>
        <div style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px;">
          Use esta calculadora para fazer suas contas!
        </div>
        <input type="text" class="calc-screen" id="calc-tela" readonly value="0">
        <div class="calc-grid">
          <button class="calc-btn limpar" onclick="calcLimpar()">C</button>
          <button class="calc-btn op" onclick="calcDigitar('(')">(</button>
          <button class="calc-btn op" onclick="calcDigitar(')')">)</button>
          <button class="calc-btn op" onclick="calcDigitar('/')">÷</button>
          
          <button class="calc-btn" onclick="calcDigitar('7')">7</button>
          <button class="calc-btn" onclick="calcDigitar('8')">8</button>
          <button class="calc-btn" onclick="calcDigitar('9')">9</button>
          <button class="calc-btn op" onclick="calcDigitar('*')">×</button>
          
          <button class="calc-btn" onclick="calcDigitar('4')">4</button>
          <button class="calc-btn" onclick="calcDigitar('5')">5</button>
          <button class="calc-btn" onclick="calcDigitar('6')">6</button>
          <button class="calc-btn op" onclick="calcDigitar('-')">-</button>
          
          <button class="calc-btn" onclick="calcDigitar('1')">1</button>
          <button class="calc-btn" onclick="calcDigitar('2')">2</button>
          <button class="calc-btn" onclick="calcDigitar('3')">3</button>
          <button class="calc-btn op" onclick="calcDigitar('+')">+</button>
          
          <button class="calc-btn" onclick="calcDigitar('0')">0</button>
          <button class="calc-btn" onclick="calcDigitar('.')">.</button>
          <button class="calc-btn igual" onclick="calcCalcular()">=</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const fasesData = [
      {
        nivel: "Fácil",
        categoria: "Multiplicação por Escalar",
        gerar: () => {
          const k = Math.floor(Math.random() * 4) + 2;
          const v = Math.floor(Math.random() * 6) + 3;
          return {
            enunciado: `Multiplique o vetor v = (${v}) pelo escalar k = ${k}.`,
            explicacao: `<strong>Regra de ouro:</strong> Multiplicar um vetor por um número (escalar) significa multiplicar cada componente do vetor por esse número. Aqui, basta calcular: ${k} × ${v}.`,
            resposta: k * v
          };
        }
      },
      {
        nivel: "Fácil",
        categoria: "Soma de Vetores 1D",
        gerar: () => {
          const a = Math.floor(Math.random() * 10) + 2;
          const b = Math.floor(Math.random() * 10) + 2;
          return {
            enunciado: `Some os vetores unidimensionais:\nA = [${a}]  e  B = [${b}]`,
            explicacao: `<strong>Regra de ouro:</strong> A soma de vetores é feita somando componente a componente. Como temos apenas uma dimensão, some diretamente: ${a} + ${b}.`,
            resposta: a + b
          };
        }
      },
      {
        nivel: "Médio",
        categoria: "Determinante 2x2",
        gerar: () => {
          const a = Math.floor(Math.random() * 4) + 1;
          const b = Math.floor(Math.random() * 3) + 1;
          const c = Math.floor(Math.random() * 3) + 1;
          const d = Math.floor(Math.random() * 4) + 2;
          return {
            enunciado: `Calcule o determinante da matriz 2x2:\n| ${a}   ${b} |\n| ${c}   ${d} |`,
            explicacao: `<strong>Regra de ouro:</strong> O determinante de uma matriz 2x2 [[a, b], [c, d]] é dado por (a × d) - (b × c).\nCálculo: (${a} × ${d}) - (${b} × ${c}) = ${a * d} - ${b * c}.`,
            resposta: (a * d) - (b * c)
          };
        }
      },
      {
        nivel: "Médio",
        categoria: "Produto Escalar (Dot Product)",
        gerar: () => {
          const x1 = Math.floor(Math.random() * 4) + 1;
          const y1 = Math.floor(Math.random() * 3) + 1;
          const x2 = Math.floor(Math.random() * 4) + 1;
          const y2 = Math.floor(Math.random() * 3) + 1;
          return {
            enunciado: `Calcule o produto escalar dos vetores:\nu = (${x1}, ${y1})  e  v = (${x2}, ${y2})`,
            explicacao: `<strong>Regra de ouro:</strong> Multiplique as coordenadas correspondentes e depois some os resultados: (x₁ × x₂) + (y₁ × y₂).\nCálculo: (${x1} × ${x2}) + (${y1} × ${y2}).`,
            resposta: (x1 * x2) + (y1 * y2)
          };
        }
      },
      {
        nivel: "Difícil",
        categoria: "Multiplicação Matriz × Vetor",
        gerar: () => {
          const a = Math.floor(Math.random() * 3) + 2;
          const b = Math.floor(Math.random() * 3) + 1;
          const c = Math.floor(Math.random() * 3) + 1;
          const d = Math.floor(Math.random() * 3) + 2;
          const vx = Math.floor(Math.random() * 3) + 2;
          const vy = Math.floor(Math.random() * 3) + 1;
          return {
            enunciado: `Calcule a 1ª coordenada (linha 1 × vetor) do produto:\n| ${a}  ${b} |  ×  | ${vx} |\n| ${c}  ${d} |     | ${vy} |`,
            explicacao: `<strong>Regra de ouro:</strong> Para achar a primeira linha do resultado, multiplique cada elemento da 1ª linha da matriz pelas coordenadas do vetor e some: (${a} × ${vx}) + (${b} × ${vy}).`,
            resposta: (a * vx) + (b * vy)
          };
        }
      },
      {
        nivel: "Difícil",
        categoria: "Autovalores em Matrizes Diagonais",
        gerar: () => {
          const l1 = Math.floor(Math.random() * 5) + 5;
          const l2 = Math.floor(Math.random() * 4) + 1;
          return {
            enunciado: `Qual é o MAIOR autovalor (λ) desta matriz diagonal?\n| ${l1}   0 |\n| 0    ${l2} |`,
            explicacao: `<strong>Regra de ouro:</strong> Em uma matriz diagonal, os autovalores são exatamente os números que estão na diagonal principal (${l1} e ${l2}). Basta identificar qual deles é o maior!`,
            resposta: Math.max(l1, l2)
          };
        }
      }
    ];

    let faseAtual = 0;
    let questaoAtual = null;

    function carregarFase() {
      const input = document.getElementById("resposta");
      input.value = "";
      document.getElementById("mensagem").innerText = "";

      const total = fasesData.length;
      const faseObj = fasesData[faseAtual];
      
      document.getElementById("fase-titulo").innerText = `Fase ${faseAtual + 1} / ${total} [${faseObj.nivel.toUpperCase()}]`;
      document.getElementById("categoria-titulo").innerText = `${faseAtual + 1}. ${faseObj.categoria}`;
      
      const progressoPercent = ((faseAtual + 1) / total) * 100;
      document.getElementById("progress-bar").style.width = progressoPercent + "%";

      questaoAtual = faseObj.gerar();
      document.getElementById("enunciado").innerText = questaoAtual.enunciado;
      document.getElementById("explicacao").innerHTML = questaoAtual.explicacao;

      input.focus();
    }

    function verificar() {
      const input = document.getElementById("resposta");
      const msg = document.getElementById("mensagem");
      const card = document.getElementById("game-box");
      const val = parseInt(input.value);

      if (isNaN(val)) {
        msg.style.color = "#ff4da6";
        msg.innerText = "Por favor, insira um número válido!";
        card.classList.add("shake");
        setTimeout(() => card.classList.remove("shake"), 400);
        return;
      }

      if (val === questaoAtual.resposta) {
        msg.style.color = "#00ff88";
        msg.innerText = "✨ EXCELENTE! Resposta correta. Avançando...";
        
        setTimeout(() => {
          faseAtual++;
          if (faseAtual >= fasesData.length) {
            mostrarVitoria();
          } else {
            carregarFase();
          }
        }, 1100);
      } else {
        msg.style.color = "#ff4da6";
        msg.innerText = "❌ Resposta incorreta. Leia a explicação acima e tente novamente!";
        card.classList.add("shake");
        setTimeout(() => card.classList.remove("shake"), 400);
      }
    }

    function mostrarVitoria() {
      const gameBox = document.getElementById("game-box");
      gameBox.innerHTML = `
        <div class="victory-screen">
          <h2>🎉 PARABÉNS, VOCÊ ESCAPOU!</h2>
          <p>Você completou todos os desafios de Álgebra Linear com sucesso e dominou os conceitos fundamentais de vetores e matrizes!</p>
          <button class="btn-restart" onclick="reiniciarJogo()">Jogar Novamente</button>
        </div>
      `;
    }

    function reiniciarJogo() {
      location.reload();
    }

    // Funções da Calculadora
    function alternarModal(abrir) {
      const modal = document.getElementById("modal-ajuda");
      if (abrir) {
        modal.classList.add("ativo");
      } else {
        modal.classList.remove("ativo");
      }
    }

    function calcLimpar() {
      document.getElementById("calc-tela").value = "0";
    }

    function calcDigitar(valor) {
      const tela = document.getElementById("calc-tela");
      if (tela.value === "0" || tela.value === "Erro") {
        tela.value = valor;
      } else {
        tela.value += valor;
      }
    }

    function calcCalcular() {
      const tela = document.getElementById("calc-tela");
      try {
        // Usa eval de forma segura apenas para expressões numéricas simples da calculadora
        let resultado = eval(tela.value.replace(/×/g, '*').replace(/÷/g, '/'));
        tela.value = resultado;
      } catch (e) {
        tela.value = "Erro";
      }
    }

    document.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        const inputElem = document.getElementById("resposta");
        if (inputElem && document.activeElement === inputElem) {
          verificar();
        }
      }
    });

    carregarFase();
  </script>
</body>
</html>
